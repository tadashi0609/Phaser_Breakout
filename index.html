<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<title>Breakout Game</title>
	<link rel="stylesheet" href="https://unpkg.com/modern-css-reset@1.4.0/dist/reset.min.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<div class="header__wrap">
			<h2 class="title">Breakout Game</h2>
			<ul class="nav__list">
				<li><a href="#">Repository</a></li>
				<li><a href="#">Portfolio</a></li>
			</ul>
		</div>
	</header>

	<main>
		<div id="gameWrap"></div>
		<div class="leaderboard">
			<h2 class="leaderboard_title">スコアランキング</h2>
			<table class="leaderboard_sortableTable">
				<thead class="leaderboard_sortableTable_head">
					<tr>
						<th scope="col" class="leaderboard_sortableTable_head-sortable sort-desc">rank</th>
						<th scope="col" class="">name</th>
						<th scope="col" class="leaderboard_sortableTable_head-sortable">score</th>
						<th scope="col" class="leaderboard_sortableTable_head-sortable">date</th>
					</tr>
				</thead>
				<tbody id="leaderboard_sortableTable_body"></tbody>
			</table>
		</div>
	</main>
	
	<script src="https://cdn.jsdelivr.net/npm/phaser@v3.90.0/dist/phaser.min.js"></script>
	<script src="js/main.js" type="module" defer></script>
</body>
</html>
